<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <!-- Sun rays gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDB813" />
      <stop offset="60%" stop-color="#F58220" />
      <stop offset="100%" stop-color="#EE3124" />
    </linearGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="50%" stop-color="#FDB813" />
      <stop offset="100%" stop-color="#F58220" />
    </radialGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE3124" />
      <stop offset="100%" stop-color="#C1272D" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sunburst Radiant Rays & Caring Hands Emblem -->
  <g transform="translate(170, 160)">
    <!-- Radiant spikes -->
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(15)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(30)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(45)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(60)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(75)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(90)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(105)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(120)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-15)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-30)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-45)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-60)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-75)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-90)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-105)" />
    <path d="M 0,-145 L 12,-110 L -12,-110 Z" fill="url(#sunGrad)" transform="rotate(-120)" />
    
    <!-- Inner soft sun ring -->
    <circle cx="0" cy="-10" r="108" fill="url(#sunHalo)" opacity="0.95" />

    <!-- Center Red/Orange Sun Sphere -->
    <circle cx="0" cy="-15" r="70" fill="url(#globeGrad)" />

    <!-- White Globe Wireframe Grid -->
    <g stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.95" transform="translate(0, -15)">
      <circle cx="0" cy="0" r="48" />
      <!-- Equator & parallels -->
      <line x1="-48" y1="0" x2="48" y2="0" />
      <ellipse cx="0" cy="0" rx="48" ry="24" />
      <!-- Meridians -->
      <line x1="0" y1="-48" x2="0" y2="48" />
      <ellipse cx="0" cy="0" rx="26" ry="48" />
    </g>

    <!-- Dynamic Green and Dark Blue Crescent Swooshes around globe -->
    <path d="M -50, -5 C -30, 45 40, 50 65, 10 C 50, 40 -15, 38 -40, -5 Z" fill="#0D5C3A" />
    <path d="M -68, -25 C -55, 60 30, 75 72, 35 C 20, 68 -45, 48 -58, -15 Z" fill="#1B264F" />

    <!-- Two stylized cupping Caring Hands below -->
    <g fill="#1B264F" transform="translate(0, 70)">
      <!-- Left Hand -->
      <path d="M -8, 20 C -25, 2 -55, -20 -105, -15 C -135, -12 -155, 5 -165, 20 C -150, 18 -125, 8 -95, 18 C -70, 26 -40, 42 -8, 48 Z" />
      <path d="M -45, -5 C -80, -22 -125, -20 -155, -5 C -145, 5 -115, 5 -85, 10 C -60, 15 -35, 25 -20, 30 Z" opacity="0.9" />
      <path d="M -15, 12 C -40, 0 -85, -2 -115, 12 C -95, 20 -60, 22 -35, 30 Z" />

      <!-- Right Hand -->
      <path d="M 8, 20 C 25, 2 55, -20 105, -15 C 135, -12 155, 5 165, 20 C 150, 18 125, 8 95, 18 C 70, 26 40, 42 8, 48 Z" />
      <path d="M 45, -5 C 80, -22 125, -20 155, -5 C 145, 5 115, 5 85, 10 C 60, 15 35, 25 20, 30 Z" opacity="0.9" />
      <path d="M 15, 12 C 40, 0 85, -2 115, 12 C 95, 20 60, 22 35, 30 Z" />
    </g>
  </g>
</svg>
